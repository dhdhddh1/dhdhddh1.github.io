<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파스텔 블루 아카이브</title>

<!-- [수정 4] 폰트를 실제로 불러옵니다. 원본은 이름만 적혀 있고 로드가 없었습니다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   색을 토큰으로 모아뒀습니다. 여기만 고치면 전체 색이 바뀝니다.
   ========================================================= */
:root{
  --bg:#f0f7f9; --surface:#ffffff; --header:#dbeafe;
  --text:#334155; --text-dim:#64748b; --text-strong:#0f172a;
  --brand:#1e40af; --brand-mid:#2563eb; --brand-light:#3b82f6;
  --line:#e0f2fe; --line-mid:#bfdbfe; --line-strong:#93c5fd;
  --soft:#f0f9ff; --danger:#ef4444;
  --shadow:rgba(186,230,253,.3);
}
/* 다크 모드 대응. 원본에는 없던 부분입니다 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --surface:#1e293b; --header:#1e3a5f;
    --text:#cbd5e1; --text-dim:#94a3b8; --text-strong:#f1f5f9;
    --brand:#93c5fd; --brand-mid:#60a5fa; --brand-light:#3b82f6;
    --line:#334155; --line-mid:#3e5372; --line-strong:#4b6a94;
    --soft:#1e2f47; --shadow:rgba(0,0,0,.3);
  }
}

*{box-sizing:border-box;}
body{
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--text); margin:0; padding:0;
  /* [수정 5] break-all은 한글을 단어 중간에서 자릅니다 */
  word-break:keep-all; overflow-wrap:anywhere;
}
:focus-visible{outline:2px solid var(--brand-mid); outline-offset:2px;}

/* ---------- 헤더 ---------- */
header{
  background:var(--header); border-bottom:2px solid var(--line-mid);
  padding:15px 30px; display:flex; justify-content:space-between;
  align-items:center; gap:12px; flex-wrap:wrap;
}
.logo-title h1{margin:0; font-size:22px; color:var(--brand); cursor:pointer;}
.logo-title p{margin:3px 0 0; color:var(--brand-light); font-size:13px;}
.auth-box{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.auth-box input{
  padding:6px 10px; border:1px solid var(--line-strong); border-radius:6px;
  font-size:13px; width:100px; background:var(--surface); color:var(--text);
}
.auth-box button{
  padding:6px 12px; border:none; background:var(--brand-light); color:#fff;
  border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;
}
.auth-box button.btn-signup{background:#60a5fa;}

/* ---------- 레이아웃 ---------- */
.container{display:flex; max-width:1400px; margin:20px auto; padding:0 15px; gap:15px;}
aside{
  width:210px; background:var(--surface); padding:15px; border-radius:10px;
  border:1px solid var(--line); box-shadow:0 2px 8px var(--shadow);
  height:fit-content; flex-shrink:0;
}
aside h3{
  margin-top:0; border-bottom:2px solid var(--line-strong); padding-bottom:8px;
  color:var(--brand); font-size:15px; cursor:pointer;
}
.category-group{margin-bottom:14px;}
.category-title{font-weight:bold; color:var(--brand-mid); margin-bottom:4px; display:block; font-size:14px;}
.sub-category{list-style:none; padding-left:6px; margin:0;}
.sub-category li{margin-bottom:4px;}
.sub-category a{
  text-decoration:none; color:var(--text-dim); font-size:12.5px;
  cursor:pointer; transition:color .2s; display:block; padding:2px 0;
}
.sub-category a:hover, .sub-category a.active{color:var(--brand-mid); font-weight:bold;}
.admin-category-box{margin-top:15px; padding-top:10px; border-top:2px dashed #fca5a5;}
.admin-category-box .category-title{color:#dc2626;}
main{flex:1; min-width:0;}

/* [수정 6] 모바일 대응. 원본에는 미디어 쿼리가 하나도 없었습니다 */
@media(max-width:820px){
  header{padding:12px 16px;}
  .container{flex-direction:column; margin:12px auto;}
  aside{width:100%;}
  aside .category-group{
    display:inline-block; vertical-align:top; width:48%; margin-right:2%;
  }
}
@media(max-width:520px){
  .auth-box input{width:80px;}
  .logo-title h1{font-size:18px;}
  aside .category-group{width:100%; margin-right:0;}
}

/* ---------- 게시판 ---------- */
.board-card, .post-detail{
  background:var(--surface); padding:20px; border-radius:10px;
  border:1px solid var(--line); box-shadow:0 2px 8px var(--shadow);
}
.post-detail{padding:30px;}
.board-header{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  margin-bottom:15px; border-bottom:2px solid var(--line-mid);
  padding-bottom:10px; flex-wrap:wrap;
}
.board-header h2{margin:0; color:var(--brand); font-size:18px;}

/* 검색창 (원본에 없던 기능) */
.search-row{display:flex; gap:8px; margin-bottom:15px;}
.search-row input{
  flex:1; padding:8px 12px; border:1px solid var(--line-mid);
  border-radius:6px; font-size:13px; background:var(--surface); color:var(--text);
}
.search-row button{
  padding:8px 16px; border:none; background:var(--brand-mid); color:#fff;
  border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;
}
.map-overview-btn{
  background:#0284c7; color:#fff; border:none; padding:8px 14px;
  border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;
  margin-bottom:15px;
}

.board-table{width:100%; border-collapse:collapse; font-size:14px;}
.board-table th,.board-table td{padding:12px 10px; text-align:left; border-bottom:1px solid var(--line);}
.board-table th{background:var(--soft); color:var(--brand-mid); font-weight:bold;}
.board-table .title-cell{color:var(--text-strong); cursor:pointer; font-weight:500;}
.board-table .title-cell:hover{color:var(--brand-mid); text-decoration:underline;}
.badge{background:var(--soft); color:var(--brand-mid); padding:2px 6px; border-radius:4px; font-size:11px;}

/* 모바일에서 표의 부가 정보 숨김 */
@media(max-width:640px){
  .board-table .col-hide{display:none;}
  .board-table th,.board-table td{padding:10px 6px; font-size:13px;}
}

/* 페이지 넘김 (원본에 없던 기능) */
.pager{display:flex; justify-content:center; gap:6px; margin-top:18px; flex-wrap:wrap;}
.pager button{
  min-width:32px; padding:6px 10px; border:1px solid var(--line-mid);
  background:var(--surface); color:var(--text); border-radius:6px;
  cursor:pointer; font-size:13px;
}
.pager button.on{background:var(--brand-mid); color:#fff; border-color:var(--brand-mid); font-weight:bold;}

/* ---------- 상세 ---------- */
.detail-title{margin:0 0 10px; font-size:24px; color:var(--text-strong);}
.detail-meta{
  display:flex; gap:15px; color:var(--text-dim); font-size:13px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:20px;
}
.media-embed-box{
  background:var(--soft); border:1px solid var(--line-mid);
  border-radius:8px; padding:15px; margin-bottom:20px;
}
.media-embed-box h4{margin:0 0 10px; color:var(--brand-mid); font-size:15px;}
.media-iframe{width:100%; height:380px; border:0; border-radius:6px;}
@media(max-width:640px){.media-iframe{height:240px;}}
.detail-body{min-height:200px; line-height:1.7;}
.detail-body img{max-width:100%; height:auto;}
/* [수정 7] 클릭한 이미지에 표시가 나도록 */
.detail-body img.sel, .editor-body img.sel{outline:3px solid var(--brand-mid);}

.detail-actions{
  margin-top:25px; padding-top:15px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.btn-opt{padding:6px 14px; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;}
.btn-back{background:#94a3b8; color:#fff;}
.btn-edit{background:#0ea5e9; color:#fff; margin-right:6px;}
.btn-delete{background:var(--danger); color:#fff;}

/* ---------- 댓글 ---------- */
.comments-section{margin-top:35px; border-top:2px solid var(--line); padding-top:20px;}
.comments-section h3{font-size:16px; color:var(--brand); margin-bottom:15px;}
.comment-write-box{display:flex; gap:10px; margin-bottom:20px;}
.comment-write-box textarea{
  flex:1; padding:10px; border:1px solid var(--line-mid); border-radius:6px;
  font-size:13px; resize:vertical; height:60px; background:var(--surface);
  color:var(--text); font-family:inherit;
}
.comment-write-box button{
  width:80px; background:var(--brand-light); color:#fff; border:none;
  border-radius:6px; font-weight:bold; cursor:pointer; flex-shrink:0;
}
.comment-item{padding:12px; border-bottom:1px solid var(--line); font-size:13px;}
.comment-item.reply{
  margin-left:30px; background:var(--soft);
  border-left:3px solid var(--line-mid); border-radius:0 6px 6px 0;
}
@media(max-width:520px){.comment-item.reply{margin-left:12px;}}
.comment-meta{display:flex; justify-content:space-between; color:var(--text-dim); font-size:12px; margin-bottom:5px; gap:8px;}
.comment-text{line-height:1.5; white-space:pre-wrap;}
.comment-actions{margin-top:5px; font-size:12px;}
.comment-actions a{color:var(--brand-mid); cursor:pointer; margin-right:10px;}
.reply-box{margin-top:8px; display:flex; gap:8px;}
.reply-box input{
  flex:1; padding:6px 10px; border:1px solid var(--line-mid);
  border-radius:4px; font-size:12px; background:var(--surface); color:var(--text);
}
.reply-box button{background:var(--brand-mid); color:#fff; border:none; padding:6px 12px; border-radius:4px; font-size:12px; cursor:pointer;}

/* ---------- 글쓰기 버튼 / 모달 ---------- */
.fab-btn{
  position:fixed; bottom:30px; right:30px; width:58px; height:58px;
  background:var(--brand-light); color:#fff; border:none; border-radius:50%;
  display:flex; justify-content:center; align-items:center; font-size:32px;
  box-shadow:0 4px 14px rgba(59,130,246,.4); cursor:pointer; z-index:100;
}
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.5);
  display:none; justify-content:center; align-items:center; z-index:1000; padding:12px;
}
.modal-content{
  background:var(--surface); width:850px; max-width:100%; max-height:92vh;
  border-radius:12px; padding:25px; overflow-y:auto;
}
.modal-header{
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:2px solid var(--line-mid); padding-bottom:10px; margin-bottom:15px;
}
.modal-header h3{margin:0; color:var(--brand);}
.close-btn{font-size:20px; cursor:pointer; color:var(--text-dim); border:none; background:none;}
.form-group{margin-bottom:12px;}
.form-group label{display:block; font-weight:bold; margin-bottom:5px; font-size:13px; color:var(--brand);}
select,input[type="text"],input[type="password"]{
  width:100%; padding:8px 12px; border:1px solid var(--line-mid);
  border-radius:6px; font-size:14px; background:var(--surface); color:var(--text);
}
.extra-option-box{
  background:var(--soft); border:1px dashed #0284c7; padding:12px;
  border-radius:6px; margin-bottom:12px; display:none;
}
.editor-toolbar{
  background:var(--soft); border:1px solid var(--line-mid); border-bottom:none;
  padding:6px 10px; border-radius:6px 6px 0 0; display:flex;
  flex-wrap:wrap; gap:6px; align-items:center;
}
.editor-toolbar button,.editor-toolbar select{
  padding:4px 8px; border:1px solid var(--line-strong); background:var(--surface);
  color:var(--text); border-radius:4px; cursor:pointer; font-size:12px; width:auto;
}
.editor-body{
  border:1px solid var(--line-mid); border-radius:0 0 6px 6px; padding:12px;
  min-height:250px; max-height:400px; overflow-y:auto;
  background:var(--surface); outline:none; line-height:1.6;
}
.editor-body img{max-width:100%; height:auto;}
.btn-submit-post{
  width:100%; background:var(--brand-mid); color:#fff; border:none; padding:10px;
  border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer; margin-top:15px;
}

/* 저장 공간 표시 (원본에 없던 기능) */
.storage-bar{margin-top:14px; font-size:11.5px; color:var(--text-dim);}
.storage-bar .track{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px;}
.storage-bar .fill{height:100%; background:var(--brand-light); transition:width .3s;}
.storage-bar .fill.warn{background:#f59e0b;}
.storage-bar .fill.full{background:var(--danger);}

.empty{text-align:center; color:var(--text-dim); padding:30px;}
</style>
</head>
<body>

<header>
  <div class="logo-title">
    <h1 id="homeBtn">🎵 파스텔 블루 아카이브</h1>
    <p>취미, 음악, 애니, 여행 이야기를 전하는 개인 블로그</p>
  </div>
  <div class="auth-box" id="authBox">
    <input type="text" id="username" placeholder="아이디" aria-label="아이디" autocomplete="username">
    <input type="password" id="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password">
    <button id="loginBtn">로그인</button>
    <button class="btn-signup" id="signupBtn">회원가입</button>
  </div>
</header>

<div class="container">
  <aside id="sidebar"></aside>
  <main id="mainContent"></main>
</div>

<button class="fab-btn" id="fabBtn" aria-label="새 글 쓰기">+</button>

<!-- 글쓰기 모달 -->
<div class="modal-overlay" id="writeModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">✍️ 새 포스팅 작성하기</h3>
      <button class="close-btn" id="closeWrite" aria-label="닫기">✖</button>
    </div>

    <div class="form-group">
      <label for="postCategory">카테고리</label>
      <select id="postCategory"></select>
    </div>

    <div class="extra-option-box" id="mapOptionBox">
      <label for="mapQuery">🗺️ 여행 구글맵 위치</label>
      <input type="text" id="mapQuery" placeholder="예: 도쿄 타워" style="margin-top:6px;">
    </div>

    <div class="extra-option-box" id="youtubeOptionBox">
      <label for="youtubeUrl">▶️ 유튜브 영상 링크</label>
      <input type="text" id="youtubeUrl" placeholder="예: https://www.youtube.com/watch?v=..." style="margin-top:6px;">
    </div>

    <div class="form-group">
      <label for="postTitle">제목</label>
      <input type="text" id="postTitle" placeholder="제목을 입력하세요" maxlength="120">
    </div>

    <div class="form-group">
      <label for="editorBody">본문</label>
      <div class="editor-toolbar">
        <select id="fontSel">
          <option value="Noto Sans KR">Noto Sans</option>
          <option value="Gungsuh">궁서체</option>
          <option value="Comic Sans MS">Comic Sans</option>
        </select>
        <select id="sizeSel">
          <option value="2">소</option>
          <option value="3" selected>중</option>
          <option value="5">대</option>
          <option value="7">최대</option>
        </select>
        <button data-cmd="bold"><b>B</b></button>
        <button data-cmd="italic"><i>I</i></button>
        <button data-cmd="underline"><u>U</u></button>
        <button data-cmd="strikeThrough"><s>S</s></button>
        <button data-cmd="justifyLeft">좌</button>
        <button data-cmd="justifyCenter">중앙</button>
        <button data-cmd="justifyRight">우</button>
        <button id="imgBtn">📷 사진</button>
        <button data-resize="50">사진 50%</button>
        <button data-resize="100">사진 100%</button>
        <input type="file" id="inlineImageInput" accept="image/*" multiple hidden>
      </div>
      <div class="editor-body" id="editorBody" contenteditable="true"></div>
    </div>

    <button class="btn-submit-post" id="savePostBtn">등록 완료</button>

    <div class="storage-bar" id="storageBar"></div>
  </div>
</div>

<!-- 지도 모아보기 모달 -->
<div class="modal-overlay" id="allMapModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🗺️ 여행지 지도 한눈에 보기</h3>
      <button class="close-btn" id="closeMap" aria-label="닫기">✖</button>
    </div>
    <div id="allMapBody"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   중요 — 이 블로그는 브라우저 저장소(localStorage)만 씁니다.
   서버가 없으므로 로그인은 "진짜 보안"이 아닙니다.
   콘솔에서 저장값을 바꾸면 누구나 관리자가 될 수 있습니다.
   연습용으로만 쓰고, 실제 개인정보는 절대 넣지 마세요.
   ========================================================================= */

const ADMIN_ID = 'dhdhddh1';
const PAGE_SIZE = 10;

const CATEGORIES = {
  '🎵 음악': ['음반 / 앨범','악기 리뷰','연주 / 연습','기타 등등'],
  '🎬 애니메이션': ['분기별 신작','명작 추천','피규어/굿즈','성우','OST','캐릭터'],
  '✈️ 여행': ['국내','일본','맛집/카페','성지순례','쇼핑'],
  '📦 기타': ['일상','게임','독서','주식','이것좀 추가해라']
};
const travelCategories = CATEGORIES['✈️ 여행'];
const youtubeCategories = [...CATEGORIES['🎵 음악'], 'OST'];

let posts = load('blog_posts', []);
let deletedPosts = load('deleted_posts', []);
let currentUser = localStorage.getItem('logged_in_user') || null;
let editingPostId = null;
let currentCategoryFilter = '전체';
let currentPage = 1;
let searchKeyword = '';
let selectedImg = null;

/* ---------- 저장소 헬퍼 ---------- */
function load(key, fallback){
  try{ return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch{ return fallback; }
}

/* [수정 3] 용량 초과를 잡습니다. 원본은 예외 처리가 없어서
   한도를 넘으면 저장이 조용히 실패했습니다 */
function save(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    if(e.name === 'QuotaExceededError' || e.code === 22){
      alert('저장 공간이 가득 찼습니다.\n\n사진이 많은 글을 지우거나, 사진 개수를 줄여 주세요.\n브라우저 저장소는 약 5MB까지만 쓸 수 있습니다.');
    }else{
      alert('저장에 실패했습니다: ' + e.message);
    }
    return false;
  }
}

function usedBytes(){
  let total = 0;
  for(const k in localStorage){
    if(Object.prototype.hasOwnProperty.call(localStorage, k)){
      total += (localStorage[k]?.length || 0) + k.length;
    }
  }
  return total * 2; // UTF-16 기준 대략치
}

function renderStorageBar(){
  const el = document.getElementById('storageBar');
  if(!el) return;
  const used = usedBytes();
  const limit = 5 * 1024 * 1024;
  const pct = Math.min(100, (used / limit) * 100);
  const cls = pct > 85 ? 'full' : (pct > 60 ? 'warn' : '');
  el.innerHTML =
    `저장 공간 ${(used/1024/1024).toFixed(2)}MB / 약 5MB 사용 중` +
    `<div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>`;
}

/* ---------- 보안 ---------- */
/* [수정 1] 비밀번호를 그대로 저장하지 않고 해시로 바꿔 저장합니다.
   서버가 없으니 완전한 보안은 아니지만, 개발자도구를 열어도
   남의 비밀번호를 읽어 다른 사이트에 시도하는 건 막을 수 있습니다. */
async function hashPw(id, pw){
  const raw = 'pastelblue|' + id + '|' + pw;
  if(window.crypto?.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  // https가 아닌 환경(파일 직접 열기 등)용 대체. 약하지만 평문보다는 낫습니다
  let h = 5381;
  for(let i=0;i<raw.length;i++){ h = ((h<<5) + h + raw.charCodeAt(i)) >>> 0; }
  return 'weak_' + h.toString(16);
}

/* [수정 8] 모든 사용자 입력값을 화면에 넣기 전에 이스케이프합니다.
   원본은 작성자 이름과 아이디를 그대로 넣어서 태그가 실행됐습니다 */
function esc(v){
  return String(v ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

   문자열로 HTML을 조립할 때 따옴표 깨짐과 주입 위험이 사라집니다 */
function bindEvents(){
  document.getElementById('homeBtn').onclick = () => { searchKeyword=''; showBoard('전체'); };
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('signupBtn').onclick = signUp;

  document.getElementById('closeWrite').onclick = closeWriteModal;
  document.getElementById('closeMap').onclick = () => document.getElementById('allMapModal').style.display='none';

  document.getElementById('postCategory').onchange = e => handleCategoryChange(e.target.value);
  document.getElementById('imgBtn').onclick = () => document.getElementById('inlineImageInput').click();
  document.getElementById('inlineImageInput').onchange = e => insertInlineImages(e.target);
  document.getElementById('fontSel').onchange = e => exec('fontName', e.target.value);
  document.getElementById('sizeSel').onchange = e => exec('fontSize', e.target.value);

  document.querySelectorAll('.editor-toolbar [data-cmd]').forEach(b => {
    b.onclick = () => exec(b.dataset.cmd);
  });
  document.querySelectorAll('.editor-toolbar [data-resize]').forEach(b => {
    b.onclick = () => resizeSelectedImg(Number(b.dataset.resize));
  });

  // [수정 7] 이미지를 클릭해 고르는 방식. 원본 로직은 거의 작동하지 않았습니다
  document.getElementById('editorBody').addEventListener('click', e => {
    document.querySelectorAll('.editor-body img.sel').forEach(i => i.classList.remove('sel'));
    if(e.target.tagName === 'IMG'){ selectedImg = e.target; e.target.classList.add('sel'); }
    else selectedImg = null;
  });

  // 비밀번호 칸에서 엔터 = 로그인
  document.getElementById('password').addEventListener('keydown', e => {
    if(e.key === 'Enter') login();
  });

  // 모달 배경 클릭 시 닫기
  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if(e.target === m) m.style.display='none'; });
  });
}

async function login(){
  const id = document.getElementById('username').value.trim();
  const pw = document.getElementById('password').value;
  if(!id || !pw) return alert('아이디와 비밀번호를 입력해 주세요.');

  const saved = localStorage.getItem('user_' + id);

  /* [수정 2] 원본에는 관리자 계정이 미등록이면 아무 비밀번호나
     통과하는 구멍이 있었습니다. 여기서는 예외 없이 대조만 합니다 */
  if(!saved) return alert('가입되지 않은 아이디입니다.');
  if(saved !== await hashPw(id, pw)) return alert('비밀번호가 올바르지 않습니다.');

  currentUser = id;
  localStorage.setItem('logged_in_user', id);
  checkLoginStatus();
  showBoard(currentCategoryFilter);
}

async function signUp(){
  const id = document.getElementById('username').value.trim();
  const pw = document.getElementById('password').value;
  if(!id || !pw) return alert('아이디와 비밀번호를 입력해 주세요.');
  if(id.length < 2 || id.length > 20) return alert('아이디는 2~20자로 입력해 주세요.');
  if(!/^[A-Za-z0-9가-힣_-]+$/.test(id)) return alert('아이디에는 한글, 영문, 숫자, - _ 만 쓸 수 있습니다.');
  if(pw.length < 4) return alert('비밀번호는 4자 이상으로 정해 주세요.');
  if(localStorage.getItem('user_' + id)) return alert('이미 존재하는 아이디입니다.');

  localStorage.setItem('user_' + id, await hashPw(id, pw));
  alert('회원가입이 완료되었습니다. 이제 로그인해 주세요.');
}

function exec(cmd, val=null){

}

/* [수정 3] 사진을 원본 그대로 저장하면 용량이 금방 찹니다.
   가로 1200px, JPEG 75% 로 줄여서 넣습니다 */
function compressImage(file, maxW=1200, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

async function insertInlineImages(input){
  const files = [...input.files];
  input.value = '';
  if(!files.length) return;

  for(const f of files){
    try{
      const dataUrl = await compressImage(f);
      document.getElementById('editorBody').focus();
      document.execCommand('insertHTML', false,
        `<img src="${dataUrl}" alt="본문 이미지" style="max-width:80%;"><br>`);
    }catch(err){
      alert(f.name + ' : ' + err.message);
    }
  }
  renderStorageBar();
}

function handleCategoryChange(cat){

function extractYoutubeId(url){
  if(!url) return null;
  const m = String(url).match(/(?:youtu\.be\/|v\/|embed\/|watch\?v=|&v=|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function openWriteModal(postId=null){
  if(!currentUser) return alert('로그인 후 이용해 주세요.');
  editingPostId = postId;
  selectedImg = null;

  const $ = id => document.getElementById(id);
  if(postId){
    const post = posts.find(p => p.id === postId);
    if(!post) return;
    $('modalTitle').textContent = '✏️ 게시글 수정하기';
    $('postCategory').value = post.category;
    $('postTitle').value = post.title;
    $('editorBody').innerHTML = post.content;
    $('mapQuery').value = post.mapQuery || '';
    $('youtubeUrl').value = post.youtubeUrl || '';
    handleCategoryChange(post.category);
  }else{
    $('modalTitle').textContent = '✍️ 새 포스팅 작성하기';
    $('postTitle').value = '';
    $('editorBody').innerHTML = '';
    $('mapQuery').value = '';
    $('youtubeUrl').value = '';
    handleCategoryChange($('postCategory').value);
  }
  renderStorageBar();
  $('writeModal').style.display = 'flex';
}

function closeWriteModal(){
  document.getElementById('writeModal').style.display = 'none';
}

function savePost(){
  const $ = id => document.getElementById(id);
  const category = $('postCategory').value;
  const title = $('postTitle').value.trim();
  const content = $('editorBody').innerHTML.trim();
  const mapQuery = $('mapQuery').value.trim();
  const youtubeUrl = $('youtubeUrl').value.trim();

  if(!title) return alert('제목을 입력해 주세요.');
  if(!content || content === '<br>') return alert('본문을 입력해 주세요.');
  if(youtubeUrl && !extractYoutubeId(youtubeUrl))
    return alert('유튜브 주소를 다시 확인해 주세요.');

  const before = JSON.stringify(posts);

  if(editingPostId){
    const i = posts.findIndex(p => p.id === editingPostId);
    posts[i] = { ...posts[i], category, title, content,
      mapQuery: travelCategories.includes(category) ? mapQuery : null,
      youtubeUrl: youtubeCategories.includes(category) ? youtubeUrl : null,
      editedAt: new Date().toLocaleString('ko-KR') };
  }else{
    posts.unshift({
      id: Date.now(), category, title, content,
      mapQuery: travelCategories.includes(category) ? mapQuery : null,
      youtubeUrl: youtubeCategories.includes(category) ? youtubeUrl : null,
      author: currentUser,
      date: new Date().toLocaleDateString('ko-KR'),
      views: 0, comments: []
    });
  }

  // 저장 실패하면 되돌립니다. 원본은 실패해도 그대로 진행했습니다
  if(!save('blog_posts', posts)){ posts = JSON.parse(before); return; }

  closeWriteModal();
  searchKeyword = '';
  showBoard(category);
}

/* ---------- 목록 ---------- */
function showBoard(category, page=1){
  currentCategoryFilter = category;
  currentPage = page;
  const main = document.getElementById('mainContent');

  if(category === '삭제된글관리'){
    if(currentUser !== ADMIN_ID){ alert('접근 권한이 없습니다.'); return showBoard('전체'); }
    return renderDeletedPostsView(main);
  }

  let list = category === '전체' ? posts : posts.filter(p => p.category === category);
  if(searchKeyword){
    const k = searchKeyword.toLowerCase();
    list = list.filter(p =>
      p.title.toLowerCase().includes(k) ||
      String(p.author||'').toLowerCase().includes(k));
  }

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = list.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  let rows = '';
  if(!pageItems.length){
    rows = `<tr><td colspan="5" class="empty">${searchKeyword ? '검색 결과가 없습니다.' : '등록된 글이 없습니다.'}</td></tr>`;
  }else{
    pageItems.forEach(p => {
      let icons = (p.mapQuery ? ' 📍' : '') + (p.youtubeUrl ? ' ▶️' : '');
      const cc = p.comments?.length || 0;
      rows += `<tr>
        <td class="col-hide"><span class="badge">${esc(p.category)}</span></td>
        <td class="title-cell" data-view="${p.id}">${esc(p.title)}${icons}${cc ? ` <span style="color:var(--brand-mid);font-size:12px;">[${cc}]</span>` : ''}</td>
        <td>${esc(p.author || '익명')}</td>
        <td class="col-hide">${esc(p.date)}</td>
        <td class="col-hide">${p.views || 0}</td>
      </tr>`;
    });
  }

  const mapBtn = travelCategories.includes(category)
    ? `<button class="map-overview-btn" id="mapAllBtn">🗺️ ${esc(category)} 지도 한눈에 보기</button>` : '';

  let pager = '';
  if(totalPages > 1){
    pager = '<div class="pager">';
    for(let i=1;i<=totalPages;i++){
      pager += `<button data-page="${i}" class="${i===currentPage?'on':''}">${i}</button>`;
    }
    pager += '</div>';
  }

  main.innerHTML = `
    <div class="board-card">
      <div class="board-header">
        <h2>📂 ${esc(category)} 목록</h2>
        <span style="font-size:13px;color:var(--text-dim);">총 ${list.length}개</span>
      </div>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="제목 또는 작성자 검색" value="${esc(searchKeyword)}" aria-label="검색">
        <button id="searchBtn">검색</button>
      </div>
      ${mapBtn}
      <table class="board-table">
        <thead><tr>
          <th class="col-hide" style="width:15%;">카테고리</th>
          <th style="width:45%;">제목</th>
          <th style="width:15%;">작성자</th>
          <th class="col-hide" style="width:15%;">작성일</th>
          <th class="col-hide" style="width:10%;">조회</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${pager}
    </div>`;

  main.querySelectorAll('[data-view]').forEach(el => {
    el.onclick = () => viewPost(Number(el.dataset.view));
  });
  main.querySelectorAll('[data-page]').forEach(el => {
    el.onclick = () => showBoard(category, Number(el.dataset.page));
  });
  const doSearch = () => {
    searchKeyword = document.getElementById('searchInput').value.trim();
    showBoard(category, 1);
  };
  document.getElementById('searchBtn').onclick = doSearch;
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') doSearch();
  });
  const mb = document.getElementById('mapAllBtn');
  if(mb) mb.onclick = () => openAllMapModal(category);
}

/* ---------- 상세 ---------- */
function viewPost(postId){
  const post = posts.find(p => p.id === postId);
  if(!post) return;

  post.views = (post.views || 0) + 1;
  save('blog_posts', posts);

  let mapHtml = '';
  if(post.mapQuery){
    mapHtml = `<div class="media-embed-box">
      <h4>📍 ${esc(post.mapQuery)}</h4>
      <iframe class="media-iframe" loading="lazy" title="구글 지도"
        src="https://maps.google.com/maps?q=${encodeURIComponent(post.mapQuery)}&z=15&output=embed"></iframe>
    </div>`;
  }

  let ytHtml = '';
  const vid = extractYoutubeId(post.youtubeUrl);
  if(vid){
    ytHtml = `<div class="media-embed-box">
      <h4>▶️ 연동 영상</h4>
      <iframe class="media-iframe" loading="lazy" title="유튜브 영상"
        src="https://www.youtube.com/embed/${esc(vid)}"
        allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
    </div>`;
  }

  const canManage = currentUser && (currentUser === post.author || currentUser === ADMIN_ID);
  const editedTag = post.editedAt ? `<span>(수정됨)</span>` : '';

  document.getElementById('mainContent').innerHTML = `
    <div class="post-detail">
      <h1 class="detail-title">${esc(post.title)}</h1>
      <div class="detail-meta">
        <span>카테고리: <b>${esc(post.category)}</b></span>
        <span>작성자: <b>${esc(post.author || '익명')}</b></span>
        <span>${esc(post.date)}</span>
        <span>조회 ${post.views}</span>
        ${editedTag}
      </div>
      ${mapHtml}${ytHtml}
      <div class="detail-body">${post.content}</div>
      <div class="detail-actions">
        <button class="btn-opt btn-back" id="backBtn">← 목록으로</button>
        ${canManage ? `<div>
          <button class="btn-opt btn-edit" id="editBtn">수정</button>
          <button class="btn-opt btn-delete" id="delBtn">삭제</button>
        </div>` : ''}
      </div>

      <div class="comments-section">
        <h3>💬 댓글 ${post.comments?.length || 0}개</h3>
        <div class="comment-write-box">
          <textarea id="commentInput" aria-label="댓글 입력" maxlength="500"
            placeholder="${currentUser ? '댓글을 입력해 보세요...' : '로그인 후 댓글 작성이 가능합니다.'}"
            ${!currentUser ? 'disabled' : ''}></textarea>
          <button id="addCommentBtn" ${!currentUser ? 'disabled' : ''}>등록</button>
        </div>
        <div id="commentsList">${renderCommentsHtml(post)}</div>
      </div>
    </div>`;

  const $ = id => document.getElementById(id);
  $('backBtn').onclick = () => showBoard(currentCategoryFilter, currentPage);
  if(canManage){
    $('editBtn').onclick = () => openWriteModal(post.id);
    $('delBtn').onclick = () => deletePost(post.id);
  }
  if(currentUser) $('addCommentBtn').onclick = () => addComment(post.id);
  bindCommentEvents(post.id);
}

function renderCommentsHtml(post){
  const list = post.comments || [];
  if(!list.length) return `<p class="empty" style="font-size:13px;">첫 댓글을 남겨보세요!</p>`;

  let html = '';
  list.filter(c => !c.parentId).forEach(c => {
    const canDel = currentUser && (currentUser === c.author || currentUser === ADMIN_ID);
    html += `<div class="comment-item">
      <div class="comment-meta"><b>${esc(c.author)}</b><span>${esc(c.date)}</span></div>
      <div class="comment-text">${esc(c.text)}</div>
      <div class="comment-actions">
        ${currentUser ? `<a data-reply="${c.id}">답글</a>` : ''}
        ${canDel ? `<a data-delc="${c.id}" style="color:var(--danger);">삭제</a>` : ''}
      </div>
      <div id="replyBox_${c.id}" class="reply-box" style="display:none;">
        <input type="text" id="replyInput_${c.id}" placeholder="답글을 입력하세요..." maxlength="300">
        <button data-addreply="${c.id}">등록</button>
      </div>
    </div>`;

    list.filter(r => r.parentId === c.id).forEach(r => {
      const canDelR = currentUser && (currentUser === r.author || currentUser === ADMIN_ID);
      html += `<div class="comment-item reply">
        <div class="comment-meta"><b>↳ ${esc(r.author)}</b><span>${esc(r.date)}</span></div>
        <div class="comment-text">${esc(r.text)}</div>
        <div class="comment-actions">
          ${canDelR ? `<a data-delc="${r.id}" style="color:var(--danger);">삭제</a>` : ''}
        </div>
      </div>`;
    });
  });
  return html;
}

function bindCommentEvents(postId){
  document.querySelectorAll('[data-reply]').forEach(el => {
    el.onclick = () => {
      const box = document.getElementById('replyBox_' + el.dataset.reply);
      box.style.display = box.style.display === 'none' ? 'flex' : 'none';
    };
  });
  document.querySelectorAll('[data-addreply]').forEach(el => {
    el.onclick = () => addReply(postId, Number(el.dataset.addreply));
  });
  document.querySelectorAll('[data-delc]').forEach(el => {
    el.onclick = () => deleteComment(postId, Number(el.dataset.delc));
  });
}

function addComment(postId){
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if(!text) return alert('댓글 내용을 입력해 주세요.');
  const post = posts.find(p => p.id === postId);
  post.comments = post.comments || [];
  post.comments.push({ id:Date.now(), author:currentUser, text,
    date:new Date().toLocaleString('ko-KR'), parentId:null });
  if(save('blog_posts', posts)) viewPost(postId);
}

function addReply(postId, parentId){
  const input = document.getElementById('replyInput_' + parentId);
  const text = input.value.trim();
  if(!text) return alert('답글 내용을 입력해 주세요.');
  const post = posts.find(p => p.id === postId);
  post.comments.push({ id:Date.now(), author:currentUser, text,
    date:new Date().toLocaleString('ko-KR'), parentId });
  if(save('blog_posts', posts)) viewPost(postId);
}

function deleteComment(postId, commentId){
  if(!confirm('댓글을 삭제하시겠습니까? 딸린 답글도 함께 지워집니다.')) return;
  const post = posts.find(p => p.id === postId);
  post.comments = post.comments.filter(c => c.id !== commentId && c.parentId !== commentId);
  if(save('blog_posts', posts)) viewPost(postId);
}

/* ---------- 삭제 / 복구 ---------- */
function deletePost(postId){
  if(!confirm('정말로 삭제하시겠습니까?')) return;
  const i = posts.findIndex(p => p.id === postId);
  if(i === -1) return;

  deletedPosts.unshift({ ...posts[i],
    deletedBy: currentUser, deletedAt: new Date().toLocaleString('ko-KR') });
  posts.splice(i, 1);
  save('blog_posts', posts);
  save('deleted_posts', deletedPosts);
  alert('삭제되어 보관함으로 이동했습니다.');
  showBoard(currentCategoryFilter);
}

function renderDeletedPostsView(container){
  let rows = deletedPosts.length ? '' :
    `<tr><td colspan="5" class="empty">삭제된 글이 없습니다.</td></tr>`;
  deletedPosts.forEach((p, i) => {
    rows += `<tr>
      <td class="col-hide"><span class="badge">${esc(p.category)}</span></td>
      <td><b>${esc(p.title)}</b> <span style="color:var(--text-dim);font-size:12px;">(${esc(p.author)})</span></td>
      <td>${esc(p.deletedBy)}</td>
      <td class="col-hide">${esc(p.deletedAt)}</td>
      <td>
        <button class="btn-opt btn-edit" data-restore="${i}">복구</button>
        <button class="btn-opt btn-delete" data-purge="${i}">완전삭제</button>
      </td>
    </tr>`;
  });

  container.innerHTML = `
    <div class="board-card">
      <div class="board-header">
        <h2 style="color:#dc2626;">🗑️ 삭제된 글 관리</h2>
        <span style="font-size:13px;color:var(--text-dim);">보관함 ${deletedPosts.length}개</span>
      </div>
      <table class="board-table">
        <thead><tr>
          <th class="col-hide">카테고리</th><th>제목</th><th>삭제자</th>
          <th class="col-hide">삭제 일시</th><th>관리</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p style="font-size:12.5px;color:var(--text-dim);margin-top:14px;">
        삭제된 글도 저장 공간을 차지합니다. 보관함이 쌓이면 완전삭제로 비워 주세요.
      </p>
    </div>`;

  container.querySelectorAll('[data-restore]').forEach(el => {
    el.onclick = () => restorePost(Number(el.dataset.restore));
  });
  container.querySelectorAll('[data-purge]').forEach(el => {
    el.onclick = () => purgePost(Number(el.dataset.purge));
  });
}

function restorePost(idx){
  const p = deletedPosts.splice(idx, 1)[0];
  delete p.deletedBy; delete p.deletedAt;
  posts.unshift(p);
  save('blog_posts', posts);
  save('deleted_posts', deletedPosts);
  alert('복구되었습니다.');
  showBoard('삭제된글관리');
}

function purgePost(idx){
  if(!confirm('완전히 삭제하면 되돌릴 수 없습니다. 진행할까요?')) return;
  deletedPosts.splice(idx, 1);
  save('deleted_posts', deletedPosts);
  showBoard('삭제된글관리');
}

/* ---------- 지도 모아보기 ---------- */
function openAllMapModal(category){
  const list = posts.filter(p => p.category === category && p.mapQuery);
  const box = document.getElementById('allMapBody');

  if(!list.length){
    box.innerHTML = `<p class="empty">지도가 등록된 글이 없습니다.</p>`;
  }else{
    box.innerHTML = '<div style="display:flex;flex-direction:column;gap:20px;">' +
      list.map(p => `
        <div style="border:1px solid var(--line-mid);padding:15px;border-radius:8px;background:var(--soft);">
          <h4 style="margin:0 0 8px;color:var(--brand-mid);cursor:pointer;" data-go="${p.id}">
            📌 ${esc(p.title)} (${esc(p.mapQuery)})</h4>
          <iframe class="media-iframe" loading="lazy" title="지도" style="height:250px;"
            src="https://maps.google.com/maps?q=${encodeURIComponent(p.mapQuery)}&z=14&output=embed"></iframe>
        </div>`).join('') + '</div>';

    box.querySelectorAll('[data-go]').forEach(el => {
      el.onclick = () => {
        document.getElementById('allMapModal').style.display = 'none';
        viewPost(Number(el.dataset.go));
      };
    });
  }
  document.getElementById('allMapModal').style.display = 'flex';
}
</script>
</body>
</html>
