<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>권민석이 심심해서 만든 뭔지모를 홈페이지</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fdf7f6; --card:#ffffff; --blush:#fcebec; --blush-2:#f8dcde;
  --ink:#3d2830; --dim:#96787f; --line:#f2e3e4;
  --red:#de4256; --red-deep:#b32c42;
  --shadow:0 4px 22px rgba(222,66,86,.08);
  --shadow-lift:0 6px 26px rgba(222,66,86,.15);
  --serif:'Gowun Batang',serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f151a; --card:#2b1d23; --blush:#3a252c; --blush-2:#4a2f37;
    --ink:#f6eaec; --dim:#b49ba2; --line:#3e2a31;
    --red:#ff7085; --red-deep:#ff9dac;
    --shadow:0 4px 22px rgba(0,0,0,.35); --shadow-lift:0 6px 26px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.78; word-break:keep-all; overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--red); outline-offset:3px;}
button{font-family:inherit;}

/* 상단 */
.top{background:radial-gradient(720px 220px at 18% -30%, var(--blush) 0%, transparent 68%), var(--card);
  border-bottom:1px solid var(--line);}
.top-in{max-width:1120px; margin:0 auto; padding:24px 26px 22px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap;}
.brand{cursor:pointer; max-width:560px;}
.brand h1{font-family:var(--serif); font-weight:700; font-size:27px; margin:0; line-height:1.3;}
.brand h1 i{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red);
  margin-left:8px; vertical-align:middle;}
.brand p{margin:3px 0 0; font-size:13px; color:var(--dim);}
.auth{display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
.auth input{padding:9px 13px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  font-size:13px; width:132px; border-radius:10px; font-family:inherit;}
.auth input::placeholder{color:var(--dim);}
.btn{padding:9px 17px; border:none; background:var(--red); color:#fff; font-size:13px;
  font-weight:700; cursor:pointer; border-radius:10px; transition:background .16s, transform .12s;}
.btn:hover{background:var(--red-deep); transform:translateY(-1px);}
.btn-soft{background:var(--blush); color:var(--red-deep);}
.btn-soft:hover{background:var(--blush-2);}
.who{font-size:13.5px; font-weight:700; cursor:pointer;}
.who i{font-style:normal; background:var(--red); color:#fff; font-size:10.5px; padding:3px 8px;
  border-radius:999px; margin-left:6px; font-weight:700;}

/* 레이아웃 */
.shell{max-width:1120px; margin:30px auto 60px; padding:0 26px; display:flex; gap:34px;}
main{flex:1; min-width:0;}
aside{width:178px; flex-shrink:0;}
.nav-all{display:block; width:100%; text-align:left; cursor:pointer; background:var(--blush);
  border:none; color:var(--red-deep); font-family:inherit; font-size:13.5px; font-weight:700;
  padding:10px 15px; border-radius:12px; margin-bottom:22px;}
.nav-all:hover{background:var(--blush-2);}
.nav-g{margin-bottom:22px;}
.nav-g > span{display:block; font-family:var(--serif); font-weight:700; font-size:15px; margin-bottom:8px; padding-left:2px;}
.nav-g ul{list-style:none; margin:0; padding:0;}
.nav-g a{display:block; padding:5px 12px; font-size:13px; color:var(--dim); cursor:pointer;
  border-radius:999px; transition:.15s;}
.nav-g a:hover{background:var(--blush); color:var(--red-deep);}
.nav-g a.on{background:var(--red); color:#fff; font-weight:700;}
.nav-admin{border-top:1px solid var(--line); padding-top:18px;}
.nav-admin > span{color:var(--red);}
.nav-tools{border-top:1px solid var(--line); padding-top:16px; margin-top:4px;}
.nav-tools button{display:block; width:100%; text-align:left; background:none; border:none;
  color:var(--dim); font-size:12.5px; cursor:pointer; padding:5px 12px; border-radius:8px; font-family:inherit;}
.nav-tools button:hover{background:var(--blush); color:var(--red-deep);}

@media(max-width:860px){
  .shell{flex-direction:column; gap:22px; padding:0 16px; margin:20px auto 48px;}
  aside{width:100%;}
  .nav-wrap{display:flex; flex-wrap:wrap; gap:16px 28px;}
  .nav-g{margin-bottom:0; min-width:128px;}
  .nav-all,.nav-tools{width:100%;}
  .top-in{padding:18px 16px 16px;}
  .brand h1{font-size:21px;}
  .auth input{width:calc(50% - 4px);}
}

/* 카드 */
.panel{background:var(--card); border-radius:20px; padding:30px 32px 34px; box-shadow:var(--shadow);}
@media(max-width:520px){.panel{padding:22px 18px 26px; border-radius:16px;}}
.head{margin-bottom:20px;}
.head .kick{font-size:12.5px; color:var(--dim); margin:0 0 3px;}
.head h2{font-family:var(--serif); font-weight:700; font-size:26px; margin:0; line-height:1.3;
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.head h2 em{font-style:normal; font-family:var(--sans); font-size:12.5px; font-weight:700;
  color:var(--red-deep); background:var(--blush); padding:4px 11px; border-radius:999px;}

.bar{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.bar input{flex:1; min-width:150px; padding:11px 16px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font-size:13.5px; border-radius:12px; font-family:inherit;}
.bar input::placeholder{color:var(--dim);}
.bar select{width:auto; padding:11px 14px; border:1px solid var(--line); background:var(--bg);
  color:var(--ink); font-size:13px; border-radius:12px; font-family:inherit; cursor:pointer;}
.bar button{padding:11px 20px; border:none; background:var(--ink); color:var(--card);
  font-size:13px; font-weight:700; cursor:pointer; border-radius:12px;}
.bar button:hover{background:var(--red); color:#fff;}

.map-all{display:block; width:100%; margin-bottom:18px; padding:12px; background:var(--blush);
  border:none; color:var(--red-deep); font-family:inherit; font-size:13px; font-weight:700;
  cursor:pointer; border-radius:12px;}
.map-all:hover{background:var(--blush-2);}

/* 목록 */
.rows{display:flex; flex-direction:column; gap:2px;}
.row{display:flex; gap:14px; align-items:flex-start; padding:15px 16px; border-radius:14px;
  cursor:pointer; transition:background .16s;}
.row:hover{background:var(--blush);}
.row + .row{border-top:1px solid var(--line);}
.row:hover, .row:hover + .row{border-top-color:transparent;}
.tag{flex-shrink:0; font-size:11px; font-weight:700; color:var(--red-deep); background:var(--blush-2);
  padding:4px 10px; border-radius:999px; margin-top:3px; line-height:1.4; max-width:96px; text-align:center;}
.row:hover .tag{background:var(--red); color:#fff;}
.r-main{flex:1; min-width:0;}
.r-title{font-size:15.5px; font-weight:700; line-height:1.5;}
.r-title .cc{color:var(--red); font-size:12px; font-weight:700; margin-left:5px;}
.r-meta{font-size:12.5px; color:var(--dim); margin-top:2px;}
.r-meta b{font-weight:500; color:var(--ink);}
@media(max-width:520px){
  .row{gap:10px; padding:13px 12px;}
  .tag{font-size:10px; padding:3px 8px; max-width:74px;}
  .r-title{font-size:14.5px;}
}
.blank{text-align:center; color:var(--dim); padding:52px 0; font-size:13.5px;}
.pager{display:flex; justify-content:center; gap:6px; margin-top:26px; flex-wrap:wrap;}
.pager button{min-width:36px; padding:7px 11px; border:none; background:var(--blush);
  color:var(--dim); cursor:pointer; font-size:13px; border-radius:10px; font-family:inherit;}
.pager button:hover{background:var(--blush-2); color:var(--red-deep);}
.pager button.on{background:var(--red); color:#fff; font-weight:700;}

/* 상세 */
.p-tag{display:inline-block; background:var(--blush); color:var(--red-deep); font-size:11.5px;
  font-weight:700; padding:5px 13px; border-radius:999px; margin-bottom:14px;}
.p-title{font-family:var(--serif); font-weight:700; font-size:29px; line-height:1.4; margin:0 0 16px;}
@media(max-width:520px){.p-title{font-size:23px;}}
.p-meta{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--dim);
  padding-bottom:20px; border-bottom:1px solid var(--line); margin-bottom:28px;}
.embed{border-radius:16px; overflow:hidden; margin-bottom:24px; background:var(--blush);}
.embed h4{margin:0; padding:11px 16px; font-size:12.5px; font-weight:700; color:var(--red-deep);}
.embed iframe{display:block; width:100%; height:360px; border:0;}
@media(max-width:640px){.embed iframe{height:230px;}}
.p-body{min-height:180px; line-height:1.9; font-size:15.5px;}
.p-body img{max-width:100%; height:auto; border-radius:12px; display:block;}

/* 사진 저장 버튼 */
.img-wrap{position:relative; display:inline-block; max-width:100%; margin:6px 0;}
.img-save{position:absolute; top:10px; right:10px; background:rgba(61,40,48,.72); color:#fff;
  border:none; padding:6px 12px; border-radius:999px; font-size:11.5px; font-weight:700;
  cursor:pointer; opacity:0; transition:opacity .18s; font-family:inherit;}
.img-wrap:hover .img-save,.img-save:focus{opacity:1;}
@media(hover:none){.img-save{opacity:.85;}}

.p-foot{margin-top:34px; padding-top:18px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.bs{padding:8px 16px; border:none; background:var(--blush); color:var(--ink); font-family:inherit;
  font-size:12.5px; font-weight:700; cursor:pointer; border-radius:10px;}
.bs:hover{background:var(--blush-2);}
.bs.red{color:var(--red-deep);}
.bs.red:hover{background:var(--red); color:#fff;}

/* 댓글 */
.cmt-sec{margin-top:46px; padding-top:26px; border-top:1px solid var(--line);}
.cmt-sec h3{font-family:var(--serif); font-weight:700; font-size:19px; margin:0 0 18px;}
.cmt-sec h3 em{font-style:normal; color:var(--red);}
.cmt-write{display:flex; gap:9px; margin-bottom:24px;}
.cmt-write textarea{flex:1; padding:13px 15px; border:1px solid var(--line); background:var(--bg);
  color:var(--ink); font-size:13.5px; height:70px; resize:vertical; font-family:inherit;
  border-radius:12px; line-height:1.6;}
.cmt-write textarea::placeholder{color:var(--dim);}
.cmt-write button{width:76px; flex-shrink:0; background:var(--red); color:#fff; border:none;
  font-weight:700; cursor:pointer; font-size:13px; border-radius:12px; font-family:inherit;}
.cmt-write button:hover:not(:disabled){background:var(--red-deep);}
.cmt-write button:disabled,.cmt-write textarea:disabled{opacity:.5; cursor:not-allowed;}
.cmt{padding:14px 16px; border-radius:14px; font-size:13.5px;}
.cmt + .cmt{margin-top:4px;}
.cmt:hover{background:var(--bg);}
.cmt.re{margin-left:26px; background:var(--blush);}
.cmt.re:hover{background:var(--blush);}
@media(max-width:520px){.cmt.re{margin-left:12px;}}
.cmt-top{display:flex; justify-content:space-between; gap:9px; font-size:12px; color:var(--dim); margin-bottom:4px;}
.cmt-top b{color:var(--ink); font-size:12.5px;}
.cmt-body{white-space:pre-wrap; line-height:1.65;}
.cmt-act{margin-top:6px; font-size:12px;}
.cmt-act a{color:var(--dim); cursor:pointer; margin-right:12px;}
.cmt-act a:hover{color:var(--red);}
.re-box{margin-top:10px; display:flex; gap:7px;}
.re-box input{flex:1; padding:8px 13px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); font-size:12.5px; font-family:inherit; border-radius:10px;}
.re-box button{background:var(--red); color:#fff; border:none; padding:8px 15px; font-size:12px;
  cursor:pointer; border-radius:10px; font-family:inherit;}

/* 글쓰기 / 모달 */
.fab{position:fixed; bottom:28px; right:28px; width:56px; height:56px; background:var(--red);
  color:#fff; border:none; border-radius:50%; font-size:28px; cursor:pointer; z-index:100;
  line-height:1; box-shadow:var(--shadow-lift); display:flex; align-items:center;
  justify-content:center; transition:transform .16s, background .16s;}
.fab:hover{background:var(--red-deep); transform:scale(1.07);}
.overlay{position:fixed; inset:0; background:rgba(61,40,48,.5); display:none;
  justify-content:center; align-items:center; z-index:1000; padding:16px; backdrop-filter:blur(2px);}
.sheet{background:var(--card); width:820px; max-width:100%; max-height:92vh; overflow-y:auto;
  border-radius:22px; padding:26px 28px 30px;}
.sheet.sm{width:430px;}
@media(max-width:520px){.sheet{padding:20px 17px 24px; border-radius:18px;}}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
.sheet-head h3{font-family:var(--serif); font-weight:700; font-size:20px; margin:0;}
.x{background:var(--blush); border:none; width:32px; height:32px; border-radius:50%;
  font-size:15px; cursor:pointer; color:var(--red-deep);}
.x:hover{background:var(--blush-2);}
.fld{margin-bottom:16px;}
.fld > label{display:block; font-size:12.5px; font-weight:700; margin-bottom:7px;}
.fld .hint{font-size:11.5px; color:var(--dim); font-weight:400; margin-top:5px; line-height:1.6;}
select,input[type=text],input[type=password],input[type=tel]{
  width:100%; padding:11px 14px; border:1px solid var(--line); background:var(--bg);
  color:var(--ink); font-size:14px; font-family:inherit; border-radius:12px;}
input::placeholder{color:var(--dim);}
.row2{display:flex; gap:7px;}
.row2 button{width:94px; flex-shrink:0; background:var(--blush); color:var(--red-deep);
  border:none; border-radius:12px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;}
.row2 button:hover{background:var(--blush-2);}
.opt-box{background:var(--blush); padding:15px 17px; margin-bottom:16px; display:none; border-radius:14px;}
.opt-box label{display:block; font-size:12.5px; font-weight:700; margin-bottom:7px; color:var(--red-deep);}
.opt-box input{background:var(--card); border-color:transparent;}
.tools{display:flex; flex-wrap:wrap; gap:5px; align-items:center; background:var(--blush);
  padding:9px 11px; border-radius:12px 12px 0 0;}
.tools button,.tools select{padding:5px 10px; border:none; background:var(--card); color:var(--ink);
  font-size:12px; cursor:pointer; width:auto; border-radius:8px; font-family:inherit;}
.tools button:hover{background:var(--red); color:#fff;}
.editor{border:1px solid var(--line); border-top:none; padding:15px; min-height:250px;
  max-height:400px; overflow-y:auto; background:var(--card); outline:none; line-height:1.8;
  border-radius:0 0 12px 12px;}
/* 이미지는 max-width 를 100% 로만 두고 크기는 width 로 조절합니다.
   예전에는 인라인으로 max-width:80% 가 박혀 있어서 width 를 100% 로
   올려도 80% 에서 잘렸습니다 */
.editor img{max-width:100%; height:auto; border-radius:10px; cursor:pointer;}
.editor img.sel{outline:3px solid var(--red); outline-offset:2px;}
.size-now{font-size:11.5px; color:var(--red-deep); margin-left:6px;}
.submit{width:100%; margin-top:20px; padding:14px; background:var(--red); color:#fff; border:none;
  font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; border-radius:14px;}
.submit:hover{background:var(--red-deep);}
.draft-tip{font-size:11.5px; color:var(--dim); margin-top:10px; text-align:right; min-height:17px;}
.gauge{margin-top:16px; font-size:11.5px; color:var(--dim);}
.gauge .track{height:6px; background:var(--blush); border-radius:999px; margin-top:6px; overflow:hidden;}
.gauge .fill{height:100%; background:var(--red); border-radius:999px; transition:width .3s;}
.gauge .fill.warn{background:#e0a028;}
.gauge .fill.full{background:var(--red-deep);}
.note{font-size:12px; color:var(--dim); margin-top:18px; line-height:1.75;}
.warn-box{background:var(--blush); border-radius:12px; padding:13px 15px; font-size:12px;
  color:var(--red-deep); line-height:1.7; margin-bottom:16px;}
hr.sep{border:none; border-top:1px solid var(--line); margin:24px 0 20px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand" id="homeBtn">
      <h1>권민석이 심심해서 만든 뭔지모를 홈페이지<i></i></h1>
      <p>취미, 음악, 애니, 여행 이야기를 전하는 공간</p>
    </div>
    <div class="auth" id="authBox"></div>
  </div>
</header>

<div class="shell">
  <aside><div class="nav-wrap" id="sidebar"></div></aside>
  <main id="mainContent"></main>
</div>

<button class="fab" id="fabBtn" aria-label="새 글 쓰기">+</button>

<!-- 회원가입 -->
<div class="overlay" id="signupModal">
  <div class="sheet sm">
    <div class="sheet-head">
      <h3>회원가입</h3>
      <button class="x" data-close="signupModal" aria-label="닫기">✕</button>
    </div>
    <div class="warn-box">
      전화번호는 <b>암호화해서 저장</b>합니다. 원문은 어디에도 남지 않고, 뒷자리 4개만 본인 확인용으로 보관합니다.
    </div>
    <div class="fld">
      <label for="regPhone">전화번호 (아이디로 사용)</label>
      <input type="tel" id="regPhone" placeholder="01012345678" inputmode="numeric" maxlength="11">
      <p class="hint">숫자만 입력하세요. 하이픈은 자동으로 지워집니다.</p>
    </div>
    <div class="fld">
      <label for="regPw">비밀번호</label>
      <input type="password" id="regPw" placeholder="4자 이상" autocomplete="new-password">
    </div>
    <div class="fld">
      <label for="regNick">닉네임</label>
      <div class="row2">
        <input type="text" id="regNick" placeholder="사용할 닉네임" maxlength="16">
        <button type="button" id="nickCheckBtn">중복 확인</button>
      </div>
      <p class="hint" id="nickMsg"></p>
    </div>
    <button class="submit" id="doSignupBtn">가입하기</button>
  </div>
</div>

<!-- 내 정보 -->
<div class="overlay" id="meModal">
  <div class="sheet sm">
    <div class="sheet-head">
      <h3>내 정보</h3>
      <button class="x" data-close="meModal" aria-label="닫기">✕</button>
    </div>
    <div id="meInfo"></div>
    <hr class="sep">
    <div class="fld">
      <label for="newNick">닉네임 변경</label>
      <div class="row2">
        <input type="text" id="newNick" placeholder="새 닉네임" maxlength="16">
        <button type="button" id="saveNickBtn">변경</button>
      </div>
      <p class="hint">바꾸면 이전에 쓴 글과 댓글의 이름도 함께 바뀝니다.</p>
    </div>
    <hr class="sep">
    <div class="fld">
      <label for="oldPw">비밀번호 변경</label>
      <input type="password" id="oldPw" placeholder="현재 비밀번호" autocomplete="current-password" style="margin-bottom:7px;">
      <div class="row2">
        <input type="password" id="newPw" placeholder="새 비밀번호 (4자 이상)" autocomplete="new-password">
        <button type="button" id="savePwBtn">변경</button>
      </div>
      <p class="hint">비밀번호를 잊으면 되찾을 방법이 없습니다. 서버가 없어서 재발급 문자를 보낼 수 없습니다.</p>
    </div>
  </div>
</div>

<!-- 글쓰기 -->
<div class="overlay" id="writeModal">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="modalTitle">새 글 쓰기</h3>
      <button class="x" data-close="writeModal" aria-label="닫기">✕</button>
    </div>
    <div class="fld">
      <label for="postCategory">카테고리</label>
      <select id="postCategory"></select>
    </div>
    <div class="opt-box" id="mapOptionBox">
      <label for="mapQuery">지도에 표시할 장소</label>

<script>
"use strict";

/* =========================================================================
   전화번호 보호 방식

   전화번호를 그대로 저장하지 않습니다. SALT를 섞어 SHA-256으로 해시한 뒤
   그 값을 열쇠로 씁니다. 저장소를 열어봐도 알아볼 수 없는 문자열만 보입니다.

     users[해시값] = { nick, pw(해시), tail(뒷자리 4개) }

   관리자 번호도 소스에 원문이 없고 해시값만 들어 있습니다.

   한계: 휴대폰 번호는 경우의 수가 1억 개 정도라, 작정하고 코드를 읽고
   전부 대입해 보면 뚫립니다. 서버 없이 막을 수 있는 한계입니다.
   여러 사람이 실제로 쓸 사이트라면 전화번호를 받지 않는 편이 안전합니다.
   ========================================================================= */

const SALT = 'ks-archive-2026|';
const ADMIN_KEY = '53b1648912c2d4e9233006ce9533a1d9271cc4e3507855bcd5d31357499458da';
const PAGE_SIZE = 10;
const RESERVED_NICKS = ['주인장','관리자','운영자','admin','Admin','ADMIN'];

const CATEGORIES = {
  '음악': ['음반 / 앨범','악기 리뷰','연주 / 연습','기타 등등'],
  '애니메이션': ['분기별 신작','명작 추천','피규어/굿즈','성우','OST','캐릭터'],
  '여행': ['국내','일본','맛집/카페','성지순례','쇼핑'],
  '기타': ['일상','게임','독서','주식','이것좀 추가해라']
};
const travelCategories = CATEGORIES['여행'];
const youtubeCategories = [...CATEGORIES['음악'], 'OST'];

let posts = load('blog_posts', []);
let deletedPosts = load('deleted_posts', []);
let users = load('user_db', {});
let me = load('current_user', null);

let editingPostId = null, currentCategoryFilter = '전체';
let currentPage = 1, searchKeyword = '', sortMode = 'new', selectedImg = null;
let nickOk = false, nickChecked = '', draftTimer = null;
const viewedThisSession = new Set();

/* ---------- 저장소 ---------- */
function load(k, fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch{ return fb; } }
function save(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){
    alert(e.name === 'QuotaExceededError' || e.code === 22
      ? '저장 공간이 가득 찼습니다.\n\n사진이 많은 글을 지우거나, 백업을 받아둔 뒤 정리해 주세요.\n브라우저 저장소는 약 5MB까지만 쓸 수 있습니다.'
      : '저장에 실패했습니다: ' + e.message);
    return false;
  }
}
function usedBytes(){
  let t = 0;
  for(const k in localStorage)
    if(Object.prototype.hasOwnProperty.call(localStorage,k)) t += (localStorage[k]?.length||0)+k.length;
  return t*2;
}
function renderStorageBar(){
  const el = document.getElementById('storageBar'); if(!el) return;
  const used = usedBytes(), limit = 5*1024*1024;
  const pct = Math.min(100, used/limit*100);
  const cls = pct>85 ? 'full' : (pct>60 ? 'warn' : '');
  el.innerHTML = `저장 공간 ${(used/1024/1024).toFixed(2)}MB / 약 5MB`
    + `<div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>`;
}

/* ---------- 해시 ---------- */
async function sha256(text){
  if(window.crypto?.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  // https가 아닌 환경(파일을 직접 열었을 때 등)용 대체. 약하지만 원문 저장보다는 낫습니다
  let h = 5381;
  for(let i=0;i<text.length;i++) h = ((h<<5)+h+text.charCodeAt(i))>>>0;
  return 'weak_' + h.toString(16);
}
const phoneKey = p => sha256(SALT + p);
const pwHash = (key, pw) => sha256(SALT + key + '|' + pw);

function esc(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const onlyDigits = s => String(s||'').replace(/[^0-9]/g,'');
const isAdmin = () => me?.key === ADMIN_KEY;

/* ---------- 시작 ---------- */
window.addEventListener('DOMContentLoaded', () => {
  buildSidebar(); buildCategorySelect(); bindEvents();
  renderAuth(); showBoard('전체');
});

function buildSidebar(){
  let h = `<button class="nav-all" data-cat="전체">전체 보기</button>`;
  for(const [g, items] of Object.entries(CATEGORIES)){
    h += `<div class="nav-g"><span>${esc(g)}</span><ul>`;
    items.forEach(c => h += `<li><a data-cat="${esc(c)}">${esc(c)}</a></li>`);
    h += `</ul></div>`;
  }
  h += `<div class="nav-g nav-admin" id="adminMenu" style="display:none;">
    <span>관리자</span><ul><li><a data-cat="삭제된글관리">삭제된 글 관리</a></li></ul></div>`;
  h += `<div class="nav-tools">
    <button id="exportBtn">데이터 백업 받기</button>
    <button id="importBtn">백업 불러오기</button>
  </div>`;
  const el = document.getElementById('sidebar');
  el.innerHTML = h;
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-cat]');
    if(t){ searchKeyword=''; showBoard(t.dataset.cat); }
  });
  document.getElementById('exportBtn').onclick = exportData;
  document.getElementById('importBtn').onclick = () => document.getElementById('importInput').click();
}

function buildCategorySelect(){
  let h = '';
  for(const [g, items] of Object.entries(CATEGORIES)){
    h += `<optgroup label="${esc(g)}">`;
    items.forEach(c => h += `<option value="${esc(c)}">${esc(c)}</option>`);
    h += `</optgroup>`;
  }
  document.getElementById('postCategory').innerHTML = h;
}

function markActiveNav(cat){
  document.querySelectorAll('#sidebar a').forEach(a =>
    a.classList.toggle('on', a.dataset.cat === cat));
}

function openModal(id){ document.getElementById(id).style.display = 'flex'; }
function closeModal(id){ document.getElementById(id).style.display = 'none'; }

function bindEvents(){
  const $ = id => document.getElementById(id);
  $('homeBtn').onclick = () => { searchKeyword=''; showBoard('전체'); };
  $('fabBtn').onclick = () => openWriteModal();
  $('savePostBtn').onclick = savePost;
  $('postCategory').onchange = e => handleCategoryChange(e.target.value);
  // 파일 선택창을 열기 전에 커서 위치를 기억해 둡니다
  $('imgBtn').onclick = () => { rememberRange(); $('inlineImageInput').click(); };
  $('inlineImageInput').onchange = e => insertInlineImages(e.target);
  $('fontSel').onchange = e => exec('fontName', e.target.value);
  $('sizeSel').onchange = e => exec('fontSize', e.target.value);
  $('nickCheckBtn').onclick = checkNick;
  $('doSignupBtn').onclick = doSignup;
  $('regNick').oninput = () => { nickOk = false; $('nickMsg').textContent = ''; };
  $('regPhone').oninput = e => { e.target.value = onlyDigits(e.target.value); };
  $('saveNickBtn').onclick = changeNick;
  $('savePwBtn').onclick = changePw;
  $('importInput').onchange = e => importData(e.target);

  document.querySelectorAll('[data-close]').forEach(b =>
    b.onclick = () => closeModal(b.dataset.close));
  document.querySelectorAll('.tools [data-cmd]').forEach(b => b.onclick = () => exec(b.dataset.cmd));
  document.querySelectorAll('.tools [data-resize]').forEach(b =>
    b.onclick = () => resizeSelectedImg(Number(b.dataset.resize)));

  $('editorBody').addEventListener('click', e => {
    document.querySelectorAll('.editor img.sel').forEach(i => i.classList.remove('sel'));
    const now = document.getElementById('sizeNow');
    if(e.target.tagName === 'IMG'){
      selectedImg = e.target;
      e.target.classList.add('sel');
      now.textContent = e.target.style.width || '선택됨';
    }else{
      selectedImg = null;
      now.textContent = '';
      rememberRange();
    }
  });
  // 커서가 움직일 때마다 위치를 기억합니다
  $('editorBody').addEventListener('keyup', rememberRange);
  $('editorBody').addEventListener('mouseup', rememberRange);
  $('editorBody').addEventListener('blur', rememberRange);
  $('editorBody').addEventListener('input', queueDraft);
  $('postTitle').addEventListener('input', queueDraft);

  document.querySelectorAll('.overlay').forEach(m =>
    m.addEventListener('click', e => { if(e.target===m) m.style.display='none'; }));

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape')
      document.querySelectorAll('.overlay').forEach(m => m.style.display='none');
  });
}

/* ---------- 로그인 / 가입 ---------- */
function renderAuth(){
  const box = document.getElementById('authBox');
  const am = document.getElementById('adminMenu');
  if(me){
    box.innerHTML = `<span class="who" id="meBtn">${esc(me.nick)}${isAdmin()?'<i>관리자</i>':''}</span>
      <button class="btn btn-soft" id="logoutBtn">로그아웃</button>`;
    document.getElementById('meBtn').onclick = openMe;
    document.getElementById('logoutBtn').onclick = logout;
    if(am) am.style.display = isAdmin() ? 'block' : 'none';
  }else{
    box.innerHTML = `<input type="tel" id="loginPhone" placeholder="전화번호 (- 없이)" aria-label="전화번호" inputmode="numeric" maxlength="11" autocomplete="username">
      <input type="password" id="loginPw" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password">
      <button class="btn" id="loginBtn">로그인</button>
      <button class="btn btn-soft" id="signupBtn">회원가입</button>`;
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('signupBtn').onclick = () => {
      nickOk = false;
      document.getElementById('nickMsg').textContent = '';
      openModal('signupModal');
    };
    document.getElementById('loginPhone').oninput = e => { e.target.value = onlyDigits(e.target.value); };
    document.getElementById('loginPw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
    if(am) am.style.display = 'none';
  }
}

async function login(){
  const phone = onlyDigits(document.getElementById('loginPhone').value);
  const pw = document.getElementById('loginPw').value;
  if(!phone || !pw) return alert('전화번호와 비밀번호를 입력해 주세요.');

  const key = await phoneKey(phone);
  const u = users[key];

  /* 원본에는 관리자 계정이 미가입 상태면 아무 비밀번호나 통과하는 구멍이
     있었습니다. 여기서는 관리자도 예외 없이 가입과 대조를 거칩니다 */
  if(!u) return alert('가입되지 않은 번호입니다.');
  if(u.pw !== await pwHash(key, pw)) return alert('비밀번호가 올바르지 않습니다.');

  me = { key, nick: u.nick };
  save('current_user', me);
  renderAuth(); showBoard(currentCategoryFilter);
}

function checkNick(){
  const nick = document.getElementById('regNick').value.trim();
  const msg = document.getElementById('nickMsg');
  if(!nick) return alert('닉네임을 입력해 주세요.');
  if(nick.length < 2) return alert('닉네임은 2자 이상으로 정해 주세요.');

  const taken = Object.values(users).some(u => u.nick === nick) || RESERVED_NICKS.includes(nick);
  if(taken){
    nickOk = false;
    msg.textContent = '이미 쓰고 있는 닉네임입니다.';
    msg.style.color = 'var(--red)';
  }else{
    nickOk = true; nickChecked = nick;
    msg.textContent = '사용할 수 있는 닉네임입니다.';
    msg.style.color = 'var(--red-deep)';
  }
}

async function doSignup(){
  const phone = onlyDigits(document.getElementById('regPhone').value);
  const pw = document.getElementById('regPw').value;
  const nick = document.getElementById('regNick').value.trim();

  if(!phone || !pw || !nick) return alert('모든 항목을 입력해 주세요.');
  if(phone.length < 10 || phone.length > 11) return alert('전화번호를 다시 확인해 주세요.');
  if(pw.length < 4) return alert('비밀번호는 4자 이상으로 정해 주세요.');
  if(!nickOk || nickChecked !== nick) return alert('닉네임 중복 확인을 해주세요.');

  const key = await phoneKey(phone);
  if(users[key]) return alert('이미 가입된 번호입니다.');

  users[key] = { nick, pw: await pwHash(key, pw), tail: phone.slice(-4) };
  if(!save('user_db', users)) return;

  alert('가입이 완료되었습니다. 로그인해 주세요.');
  closeModal('signupModal');
  document.getElementById('regPhone').value = '';
  document.getElementById('regPw').value = '';
  document.getElementById('regNick').value = '';
  document.getElementById('nickMsg').textContent = '';
  nickOk = false;
}

function logout(){
  me = null;
  localStorage.removeItem('current_user');
  location.reload();
}

/* ---------- 내 정보 ---------- */
function openMe(){
  const u = users[me.key];
  document.getElementById('meInfo').innerHTML = `
    <div class="warn-box">
      <b>${esc(me.nick)}</b>${isAdmin()?' · 관리자':''}<br>
      가입 번호 뒷자리 · ****${esc(u?.tail || '----')}
    </div>`;
  document.getElementById('newNick').value = '';
  document.getElementById('oldPw').value = '';
  document.getElementById('newPw').value = '';
  openModal('meModal');
}

function changeNick(){
  const nick = document.getElementById('newNick').value.trim();
  if(!nick) return alert('새 닉네임을 입력해 주세요.');
  if(nick.length < 2) return alert('닉네임은 2자 이상으로 정해 주세요.');
  if(nick === me.nick) return alert('지금 쓰는 닉네임과 같습니다.');
  if(Object.values(users).some(u => u.nick === nick) || RESERVED_NICKS.includes(nick))
    return alert('이미 쓰고 있는 닉네임입니다.');

  users[me.key].nick = nick;
  // 이전에 쓴 글과 댓글의 이름도 함께 바꿉니다
  posts.forEach(p => {
    if(p.authorKey === me.key) p.authorNick = nick;
    (p.comments||[]).forEach(c => { if(c.authorKey === me.key) c.authorNick = nick; });
  });
  deletedPosts.forEach(p => { if(p.authorKey === me.key) p.authorNick = nick; });

  me.nick = nick;
  save('user_db', users); save('blog_posts', posts);
  save('deleted_posts', deletedPosts); save('current_user', me);

  alert('닉네임을 바꿨습니다.');
  closeModal('meModal'); renderAuth(); showBoard(currentCategoryFilter);
}

async function changePw(){
  const oldPw = document.getElementById('oldPw').value;
  const newPw = document.getElementById('newPw').value;
  if(!oldPw || !newPw) return alert('현재 비밀번호와 새 비밀번호를 모두 입력해 주세요.');
  if(newPw.length < 4) return alert('새 비밀번호는 4자 이상으로 정해 주세요.');
  if(users[me.key].pw !== await pwHash(me.key, oldPw)) return alert('현재 비밀번호가 올바르지 않습니다.');

  users[me.key].pw = await pwHash(me.key, newPw);
  save('user_db', users);
  alert('비밀번호를 바꿨습니다.');
  closeModal('meModal');
}

/* ---------- 백업 / 복원 ----------
   이 사이트의 글은 브라우저 안에만 있습니다. 캐시를 지우면 전부 사라집니다.
   가끔 백업을 받아두는 것이 유일한 안전장치입니다 */
function exportData(){
  const data = { version:1, savedAt:new Date().toISOString(), posts, deletedPosts, users };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `blog-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function importData(input){
  const file = input.files?.[0];
  input.value = '';
  if(!file) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!Array.isArray(d.posts)) throw new Error('백업 파일 형식이 아닙니다.');
      if(!confirm(`백업을 불러오면 지금 있는 글이 모두 덮어씌워집니다.\n\n글 ${d.posts.length}개 · 계정 ${Object.keys(d.users||{}).length}개\n\n진행할까요?`)) return;
      posts = d.posts;
      deletedPosts = d.deletedPosts || [];
      users = d.users || {};
      save('blog_posts', posts); save('deleted_posts', deletedPosts); save('user_db', users);
      localStorage.removeItem('current_user');
      alert('복원했습니다. 다시 로그인해 주세요.');
      location.reload();
    }catch(err){ alert('불러오기에 실패했습니다: ' + err.message); }
  };
  r.readAsText(file);
}

/* ---------- 에디터 ----------

   사진을 넣으면 본문이 통째로 지워지던 문제

   파일 선택창을 열고 사진을 읽는 동안 커서 위치(선택 영역)가 풀립니다.
   그 상태에서 insertHTML 을 실행하면 본문 전체가 선택된 것으로 처리돼
   기존 내용을 덮어썼습니다.

   그래서 커서 위치를 미리 기억해 두었다가 복원한 뒤,
   execCommand 대신 Range API 로 직접 끼워 넣도록 바꿨습니다. */

let savedRange = null;

function rememberRange(){
  const ed = document.getElementById('editorBody');
  const sel = window.getSelection();
  if(sel && sel.rangeCount && ed.contains(sel.anchorNode)){
    savedRange = sel.getRangeAt(0).cloneRange();
  }
}

function restoreRange(){
  const ed = document.getElementById('editorBody');
  ed.focus();
  const sel = window.getSelection();
  sel.removeAllRanges();
  if(savedRange && ed.contains(savedRange.commonAncestorContainer)){
    sel.addRange(savedRange);
  }else{
    const r = document.createRange();   // 기억한 위치가 없으면 맨 끝에
    r.selectNodeContents(ed);
    r.collapse(false);
    sel.addRange(r);
  }
}

function insertAtCaret(node){
  restoreRange();
  const sel = window.getSelection();
  const range = sel.getRangeAt(0);
  range.deleteContents();
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  sel.removeAllRanges(); sel.addRange(range);
  savedRange = range.cloneRange();
}

function exec(cmd, val=null){
  restoreRange();
  document.execCommand(cmd, false, val);
  rememberRange();
}
function compressImage(file, maxW=1000, q=0.7){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxW/img.width);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = () => rej(new Error('이미지를 읽을 수 없습니다.'));
      img.src = e.target.result;
    };
    r.onerror = () => rej(new Error('파일을 읽을 수 없습니다.'));
    r.readAsDataURL(file);
  });
}
async function insertInlineImages(input){
  const files = [...input.files]; input.value = '';
  for(const f of files){
    try{
      const url = await compressImage(f);
      const img = document.createElement('img');
      img.src = url;
      img.alt = '본문 이미지';
      img.style.width = '75%';        // 크기는 width 로만. max-width 는 CSS 가 100% 로 잡습니다
      const br = document.createElement('br');
      insertAtCaret(img);
      insertAtCaret(br);
    }catch(err){ alert(f.name + ' : ' + err.message); }
  }
  queueDraft(); renderStorageBar();
}

function resizeSelectedImg(p){
  if(!selectedImg) return alert('크기를 바꿀 사진을 먼저 클릭해 주세요.');
  selectedImg.style.removeProperty('max-width');  // 예전 글에 박혀 있던 값 제거
  selectedImg.style.width = p + '%';
  document.getElementById('sizeNow').textContent = p + '%';
  queueDraft();
}

/* ---------- 임시저장 ---------- */
function queueDraft(){
  if(editingPostId) return;            // 수정 중에는 임시저장하지 않습니다
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    const title = document.getElementById('postTitle').value;
    const content = document.getElementById('editorBody').innerHTML;
    if(!title && !content) return;
    try{
      localStorage.setItem('draft', JSON.stringify({
        title, content,
        category: document.getElementById('postCategory').value,
        at: Date.now()
      }));
      document.getElementById('draftTip').textContent =
        '임시저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
    }catch{}
  }, 900);
}
function clearDraft(){
  localStorage.removeItem('draft');
  const t = document.getElementById('draftTip');
  if(t) t.textContent = '';
}

/* ---------- 글쓰기 ---------- */
function handleCategoryChange(cat){
  document.getElementById('mapOptionBox').style.display = travelCategories.includes(cat)?'block':'none';
  document.getElementById('youtubeOptionBox').style.display = youtubeCategories.includes(cat)?'block':'none';
}
function extractYoutubeId(url){
  if(!url) return null;
  const m = String(url).match(/(?:youtu\.be\/|v\/|embed\/|watch\?v=|&v=|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function openWriteModal(postId=null){
  if(!me) return alert('로그인 후 이용해 주세요.');
  editingPostId = postId; selectedImg = null;
  const $ = id => document.getElementById(id);
  $('draftTip').textContent = '';

  if(postId){
    const p = posts.find(x => x.id === postId); if(!p) return;
    $('modalTitle').textContent = '글 수정';
    $('postCategory').value = p.category; $('postTitle').value = p.title;
    $('editorBody').innerHTML = p.content;
    $('mapQuery').value = p.mapQuery || ''; $('youtubeUrl').value = p.youtubeUrl || '';
    handleCategoryChange(p.category);
  }else{
    $('modalTitle').textContent = '새 글 쓰기';
    const d = load('draft', null);
    if(d && (d.title || d.content) &&
       confirm(`쓰다 만 글이 있습니다.\n(${new Date(d.at).toLocaleString('ko-KR')})\n\n이어서 쓸까요?`)){
      $('postTitle').value = d.title || '';
      $('editorBody').innerHTML = d.content || '';
      if(d.category) $('postCategory').value = d.category;
    }else{
      $('postTitle').value = ''; $('editorBody').innerHTML = '';
      clearDraft();
    }
    $('mapQuery').value = ''; $('youtubeUrl').value = '';
    handleCategoryChange($('postCategory').value);
  }
  renderStorageBar();
  openModal('writeModal');
}

function savePost(){
  const $ = id => document.getElementById(id);
  const category = $('postCategory').value;
  const title = $('postTitle').value.trim();
  const content = $('editorBody').innerHTML.trim();
  const mapQuery = $('mapQuery').value.trim();
  const youtubeUrl = $('youtubeUrl').value.trim();

  if(!title) return alert('제목을 입력해 주세요.');
  if(!content || content === '<br>') return alert('본문을 입력해 주세요.');
  if(youtubeUrl && !extractYoutubeId(youtubeUrl)) return alert('유튜브 주소를 다시 확인해 주세요.');

  const backup = JSON.stringify(posts);
  if(editingPostId){
    const i = posts.findIndex(p => p.id === editingPostId);
    posts[i] = { ...posts[i], category, title, content,
      mapQuery: travelCategories.includes(category) ? mapQuery : null,
      youtubeUrl: youtubeCategories.includes(category) ? youtubeUrl : null,
      editedAt: new Date().toLocaleString('ko-KR') };
  }else{
    posts.unshift({ id:Date.now(), category, title, content,
      mapQuery: travelCategories.includes(category) ? mapQuery : null,
      youtubeUrl: youtubeCategories.includes(category) ? youtubeUrl : null,
      authorNick: me.nick, authorKey: me.key,
      date: new Date().toLocaleDateString('ko-KR'),
      views:0, comments:[] });
  }
  // 저장에 실패하면 되돌립니다. 글이 조용히 사라지지 않게 하려는 처리입니다
  if(!save('blog_posts', posts)){ posts = JSON.parse(backup); return; }

  clearDraft();
  closeModal('writeModal'); searchKeyword=''; showBoard(category);
}

/* ---------- 목록 ---------- */
function sortList(list){
  const a = [...list];
  if(sortMode === 'views') a.sort((x,y) => (y.views||0)-(x.views||0));
  else if(sortMode === 'cmt') a.sort((x,y) => (y.comments?.length||0)-(x.comments?.length||0));
  else a.sort((x,y) => y.id - x.id);
  return a;
}

function showBoard(category, page=1){
  currentCategoryFilter = category; currentPage = page;
  markActiveNav(category);
  const main = document.getElementById('mainContent');

  if(category === '삭제된글관리'){
    if(!isAdmin()){ alert('접근 권한이 없습니다.'); return showBoard('전체'); }
    return renderDeletedPostsView(main);
  }

  let list = category === '전체' ? posts
    : (category === '내글' ? posts.filter(p => p.authorKey === me?.key)
    : posts.filter(p => p.category === category));

  if(searchKeyword){
    const k = searchKeyword.toLowerCase();
    list = list.filter(p => String(p.title||'').toLowerCase().includes(k)
      || String(p.authorNick||'').toLowerCase().includes(k));
  }
  list = sortList(list);

  const totalPages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const items = list.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  let rows = items.length ? '' :
    `<div class="blank">${searchKeyword ? '검색 결과가 없습니다.' : '아직 글이 없습니다.'}</div>`;
  items.forEach(p => {
    const marks = (p.mapQuery ? ' 📍' : '') + (p.youtubeUrl ? ' ▶' : '');
    const cc = p.comments?.length || 0;
    rows += `<div class="row" data-view="${p.id}">
      <div class="tag">${esc(p.category)}</div>
      <div class="r-main">
        <div class="r-title">${esc(p.title)}${marks}${cc?`<span class="cc">${cc}</span>`:''}</div>
        <div class="r-meta"><b>${esc(p.authorNick||'익명')}</b> · ${esc(p.date)} · 조회 ${p.views||0}</div>
      </div>
    </div>`;
  });

  let pager = '';
  if(totalPages > 1){
    pager = '<div class="pager">';
    for(let i=1;i<=totalPages;i++)
      pager += `<button data-page="${i}" class="${i===currentPage?'on':''}">${i}</button>`;
    pager += '</div>';
  }

  const heading = searchKeyword || (category === '내글' ? '내가 쓴 글' : category);

  main.innerHTML = `<div class="panel">
    <div class="head">
      <p class="kick">${searchKeyword ? '검색 결과' : '카테고리'}</p>
      <h2>${esc(heading)}<em>${list.length}건</em></h2>
    </div>
    <div class="bar">
      <input type="text" id="searchInput" placeholder="제목 또는 작성자 검색" value="${esc(searchKeyword)}" aria-label="검색">
      <select id="sortSel" aria-label="정렬 기준">
        <option value="new"${sortMode==='new'?' selected':''}>최신순</option>
        <option value="views"${sortMode==='views'?' selected':''}>조회순</option>
        <option value="cmt"${sortMode==='cmt'?' selected':''}>댓글순</option>
      </select>
      <button id="searchBtn">검색</button>
      ${me && category !== '내글' ? `<button id="mineBtn" style="background:var(--blush);color:var(--red-deep);">내 글</button>` : ''}
    </div>
    ${travelCategories.includes(category)
      ? `<button class="map-all" id="mapAllBtn">${esc(category)} 지도 모아보기</button>` : ''}
    <div class="rows">${rows}</div>
    ${pager}
  </div>`;

  main.querySelectorAll('[data-view]').forEach(el =>
    el.onclick = () => viewPost(Number(el.dataset.view)));
  main.querySelectorAll('[data-page]').forEach(el =>
    el.onclick = () => showBoard(category, Number(el.dataset.page)));
  const go = () => { searchKeyword = document.getElementById('searchInput').value.trim(); showBoard(category,1); };
  document.getElementById('searchBtn').onclick = go;
  document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  document.getElementById('sortSel').onchange = e => { sortMode = e.target.value; showBoard(category, 1); };
  const mineBtn = document.getElementById('mineBtn');
  if(mineBtn) mineBtn.onclick = () => { searchKeyword=''; showBoard('내글'); };
  const mb = document.getElementById('mapAllBtn');
  if(mb) mb.onclick = () => openAllMapModal(category);
}

/* ---------- 상세 ---------- */
function viewPost(postId){
  try{ renderPost(postId); }
  catch(err){
    // 글 하나가 잘못돼도 화면 전체가 날아가지 않게 합니다
    console.error('글 표시 실패:', err);
    alert('이 글을 여는 중 문제가 생겼습니다.\n\n' + err.message);
  }
}

function renderPost(postId){
  const post = posts.find(p => p.id === postId);
  if(!post){ alert('글을 찾을 수 없습니다.'); return; }

  // 새로고침할 때마다 조회수가 오르지 않도록 한 번만 셉니다
  if(!viewedThisSession.has(postId)){
    viewedThisSession.add(postId);
    post.views = (post.views||0)+1;
    save('blog_posts', posts);
  }

  const mapHtml = post.mapQuery ? `<div class="embed">
      <h4>${esc(post.mapQuery)}</h4>
      <iframe loading="lazy" title="구글 지도"
        src="https://maps.google.com/maps?q=${encodeURIComponent(post.mapQuery)}&z=15&output=embed"></iframe>
    </div>` : '';

  const vid = extractYoutubeId(post.youtubeUrl);
  const ytHtml = vid ? `<div class="embed">
      <h4>연동 영상</h4>
      <iframe loading="lazy" title="유튜브 영상" src="https://www.youtube.com/embed/${esc(vid)}"
        allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>` : '';

  const canManage = me && (me.key === post.authorKey || isAdmin());

  document.getElementById('mainContent').innerHTML = `<div class="panel">
    <span class="p-tag">${esc(post.category)}</span>
    <h1 class="p-title">${esc(post.title)}</h1>
    <div class="p-meta">
      <span>${esc(post.authorNick||'익명')}</span><span>${esc(post.date)}</span>
      <span>조회 ${post.views}</span>${post.editedAt?'<span>수정됨</span>':''}
    </div>
    ${mapHtml}${ytHtml}
    <div class="p-body" id="postBody">${post.content}</div>
    <div class="p-foot">
      <button class="bs" id="backBtn">목록으로</button>
      ${canManage ? `<div>
        <button class="bs" id="editBtn">수정</button>
        <button class="bs red" id="delBtn">삭제</button></div>` : ''}
    </div>

    <div class="cmt-sec">
      <h3>댓글 <em>${post.comments?.length||0}</em></h3>
      <div class="cmt-write">
        <textarea id="commentInput" aria-label="댓글 입력" maxlength="500"
          placeholder="${me?'댓글을 남겨보세요':'로그인 후 댓글을 쓸 수 있습니다'}"
          ${!me?'disabled':''}></textarea>
        <button id="addCommentBtn" ${!me?'disabled':''}>등록</button>
      </div>
      <div>${renderCommentsHtml(post)}</div>
    </div>
  </div>`;

  attachImageSaveButtons();

  const $ = id => document.getElementById(id);
  $('backBtn').onclick = () => showBoard(currentCategoryFilter, currentPage);
  if(canManage){
    $('editBtn').onclick = () => openWriteModal(post.id);
    $('delBtn').onclick = () => deletePost(post.id);
  }
  if(me) $('addCommentBtn').onclick = () => addComment(post.id);
  bindCommentEvents(post.id);
}

/* 본문 사진마다 저장 버튼을 붙입니다.
   원본은 정규식으로 HTML 문자열을 바꿨는데, 그 방식은 속성에 따옴표가
   섞이면 깨집니다. 여기서는 화면에 그려진 뒤 DOM으로 직접 감쌉니다 */
function attachImageSaveButtons(){
  document.querySelectorAll('#postBody img').forEach((img, i) => {
    if(img.parentElement?.classList.contains('img-wrap')) return;
    const wrap = document.createElement('span');
    wrap.className = 'img-wrap';
    img.parentNode.insertBefore(wrap, img);
    wrap.appendChild(img);

    const btn = document.createElement('button');
    btn.className = 'img-save';
    btn.type = 'button';
    btn.textContent = '사진 저장';
    btn.onclick = () => {
      const a = document.createElement('a');
      a.href = img.src;
      a.download = `photo_${Date.now()}_${i+1}.jpg`;
      document.body.appendChild(a); a.click(); a.remove();
    };
    wrap.appendChild(btn);
  });
}

function renderCommentsHtml(post){
  const list = post.comments || [];
  if(!list.length) return `<div class="blank">첫 댓글을 남겨보세요.</div>`;
  let h = '';
  list.filter(c => !c.parentId).forEach(c => {
    const canDel = me && (me.key === c.authorKey || isAdmin());
    h += `<div class="cmt">
      <div class="cmt-top"><b>${esc(c.authorNick)}</b><span>${esc(c.date)}</span></div>
      <div class="cmt-body">${esc(c.text)}</div>
      <div class="cmt-act">
        ${me?`<a data-reply="${c.id}">답글</a>`:''}
        ${canDel?`<a data-delc="${c.id}">삭제</a>`:''}
      </div>
      <div id="replyBox_${c.id}" class="re-box" style="display:none;">
        <input type="text" id="replyInput_${c.id}" placeholder="답글" maxlength="300">
        <button data-addreply="${c.id}">등록</button>
      </div></div>`;
    list.filter(r => r.parentId === c.id).forEach(r => {
      const cd = me && (me.key === r.authorKey || isAdmin());
      h += `<div class="cmt re">
        <div class="cmt-top"><b>${esc(r.authorNick)}</b><span>${esc(r.date)}</span></div>
        <div class="cmt-body">${esc(r.text)}</div>
        <div class="cmt-act">${cd?`<a data-delc="${r.id}">삭제</a>`:''}</div>
      </div>`;
    });
  });
  return h;
}

function bindCommentEvents(postId){
  document.querySelectorAll('[data-reply]').forEach(el => el.onclick = () => {
    const b = document.getElementById('replyBox_' + el.dataset.reply);
    b.style.display = b.style.display === 'none' ? 'flex' : 'none';
  });
  document.querySelectorAll('[data-addreply]').forEach(el =>
    el.onclick = () => addReply(postId, Number(el.dataset.addreply)));
  document.querySelectorAll('[data-delc]').forEach(el =>
    el.onclick = () => deleteComment(postId, Number(el.dataset.delc)));
}

function addComment(postId){
  const t = document.getElementById('commentInput').value.trim();
  if(!t) return alert('댓글 내용을 입력해 주세요.');
  const p = posts.find(x => x.id === postId);
  p.comments = p.comments || [];
  p.comments.push({ id:Date.now(), authorNick:me.nick, authorKey:me.key, text:t,
    date:new Date().toLocaleString('ko-KR'), parentId:null });
  if(save('blog_posts', posts)) viewPost(postId);
}
function addReply(postId, parentId){
  const t = document.getElementById('replyInput_' + parentId).value.trim();
  if(!t) return alert('답글 내용을 입력해 주세요.');
  const p = posts.find(x => x.id === postId);
  p.comments.push({ id:Date.now(), authorNick:me.nick, authorKey:me.key, text:t,
    date:new Date().toLocaleString('ko-KR'), parentId });
  if(save('blog_posts', posts)) viewPost(postId);
}
function deleteComment(postId, cid){
  if(!confirm('댓글을 삭제할까요? 딸린 답글도 함께 지워집니다.')) return;
  const p = posts.find(x => x.id === postId);
  p.comments = p.comments.filter(c => c.id !== cid && c.parentId !== cid);
  if(save('blog_posts', posts)) viewPost(postId);
}

/* ---------- 삭제 / 복구 ---------- */
function deletePost(postId){
  if(!confirm('정말 삭제할까요?')) return;
  const i = posts.findIndex(p => p.id === postId); if(i === -1) return;
  deletedPosts.unshift({ ...posts[i], deletedBy:me.nick,
    deletedAt:new Date().toLocaleString('ko-KR') });
  posts.splice(i,1);
  save('blog_posts', posts); save('deleted_posts', deletedPosts);
  showBoard(currentCategoryFilter);
}

function renderDeletedPostsView(c){
  let rows = deletedPosts.length ? '' : `<div class="blank">삭제된 글이 없습니다.</div>`;
  deletedPosts.forEach((p, i) => {
    rows += `<div class="row" style="cursor:default;">
      <div class="tag">${esc(p.category)}</div>
      <div class="r-main">
        <div class="r-title">${esc(p.title)}</div>
        <div class="r-meta">작성 <b>${esc(p.authorNick)}</b> · 삭제 <b>${esc(p.deletedBy)}</b> · ${esc(p.deletedAt)}</div>
        <div style="margin-top:10px;">
          <button class="bs" data-restore="${i}">복구</button>
          <button class="bs red" data-purge="${i}">완전삭제</button>
        </div>
      </div></div>`;
  });
  c.innerHTML = `<div class="panel">
    <div class="head">
      <p class="kick">관리자</p>
      <h2>삭제된 글<em>${deletedPosts.length}건</em></h2>
    </div>
    <div class="rows">${rows}</div>
    <p class="note">삭제된 글도 저장 공간을 차지합니다. 보관함이 쌓이면 완전삭제로 비워 주세요.</p>
  </div>`;
  c.querySelectorAll('[data-restore]').forEach(el =>
    el.onclick = () => restorePost(Number(el.dataset.restore)));
  c.querySelectorAll('[data-purge]').forEach(el =>
    el.onclick = () => purgePost(Number(el.dataset.purge)));
}

function restorePost(i){
  const p = deletedPosts.splice(i,1)[0];
  delete p.deletedBy; delete p.deletedAt;
  posts.unshift(p);
  save('blog_posts', posts); save('deleted_posts', deletedPosts);
  showBoard('삭제된글관리');
}
function purgePost(i){
  if(!confirm('완전히 삭제하면 되돌릴 수 없습니다. 진행할까요?')) return;
  deletedPosts.splice(i,1);
  save('deleted_posts', deletedPosts);
  showBoard('삭제된글관리');
}

/* ---------- 지도 모아보기 ---------- */
function openAllMapModal(category){
  const list = posts.filter(p => p.category === category && p.mapQuery);
  const box = document.getElementById('allMapBody');
  box.innerHTML = list.length
    ? list.map(p => `<div class="embed">
        <h4 style="cursor:pointer;" data-go="${p.id}">${esc(p.title)} — ${esc(p.mapQuery)}</h4>
        <iframe loading="lazy" title="지도" style="height:240px;"
          src="https://maps.google.com/maps?q=${encodeURIComponent(p.mapQuery)}&z=14&output=embed"></iframe>
      </div>`).join('')
    : `<div class="blank">지도가 등록된 글이 없습니다.</div>`;
  box.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
    closeModal('allMapModal');
    viewPost(Number(el.dataset.go));
  });
  openModal('allMapModal');
}
